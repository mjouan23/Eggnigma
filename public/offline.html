<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hors ligne</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #F4F1E8;
            color: #3A2A1F;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 1.5rem;
        }
        .card {
            max-width: 420px;
            width: 100%;
            background: #FFFFFF;
            border-radius: 24px;
            box-shadow: 0 16px 40px rgba(0,0,0,0.1);
            padding: 2rem;
        }
        .card img {
            width: 96px;
            margin-bottom: 1rem;
        }
        .card h1 {
            margin: 0 0 1rem;
            font-size: 1.5rem;
        }
        .card p {
            margin: 0 0 1.5rem;
            line-height: 1.6;
        }
        .card a {
            display: inline-block;
            padding: 0.8rem 1.4rem;
            border-radius: 999px;
            color: #ffffff;
            background: #3FA7B3;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="/images/logo.png" alt="Logo">
        <h1>Hors ligne</h1>
        <p>Ton application est maintenant installable et conservée localement. Reviens lorsque tu es connecté pour charger les énigmes.</p>
        <a href="/">Retour à l'accueil</a>
    </div>
</body>
</html>
